[project]
name = "jarvis-bridge"
version = "0.1.0"
description = "Local push-to-talk bridge for WhatsApp Desktop on macOS"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-ApplicationServices>=10.0",
    "pynput>=1.7.7",
    "pillow>=11.3",
    "browser-harness>=0.1.9",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
voice = ["vosk>=0.3.45", "sounddevice>=0.4.6"]
[project.scripts]
jarvis-bridge = "bridge.main:main"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]

include = ["bridge*"]
