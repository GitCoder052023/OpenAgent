[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenAgent"
version = "0.1.0"
description = "Local push-to-talk bridge for WhatsApp Desktop on macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-ApplicationServices>=10.0",
    "pynput>=1.7.7",
    "pillow>=11.3",
    "browser-harness>=0.1.9",
    "macos-harness>=0.1.2",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
voice = ["sounddevice>=0.4.6"]
# On-device Whisper Large V3 Turbo on the Apple Silicon GPU. Platform-gated, so
# `uv sync --all-extras` is a no-op for it elsewhere and whisper.cpp takes over.
stt = ["mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
OpenAgent = "OpenAgent.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["OpenAgent*"]

[tool.uv.sources]
browser-harness = { workspace = true }
macos-harness = { workspace = true }

[tool.uv.workspace]
members = ["src/tools/macos-harness", "src/tools/browser-harness"]


