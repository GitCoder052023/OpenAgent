[project]
name = "jarvis-bridge"
version = "0.1.0"
description = "Local push-to-talk bridge for WhatsApp Desktop on macOS"
requires-python = ">=3.11"
dependencies = ["pyobjc-framework-ApplicationServices>=10.0", "pynput>=1.7.7"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
jarvis-bridge = "bridge.main:main"
[tool.pytest.ini_options]
pythonpath = ["."]
