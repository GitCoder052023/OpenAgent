[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenAgent"
version = "0.1.0"
description = "Local push-to-talk bridge for WhatsApp Desktop on macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-ApplicationServices>=10.0",
    "pynput>=1.7.7",
    "pillow>=11.3",
    "browser-harness>=0.1.9",
    "macos-harness>=0.1.2",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
voice = ["vosk==0.3.44", "sounddevice>=0.4.6"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
OpenAgent = "OpenAgent.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["OpenAgent*"]

[tool.uv.sources]
browser-harness = { workspace = true }
macos-harness = { workspace = true }

[tool.uv.workspace]
members = ["src/tools/macos-harness", "src/tools/browser-harness"]


