name: Build

env:
  GO_VERSION: "1.25.8"

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

jobs:

  go-tests:
    name: Running Go tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: openagent
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.mod
      - name: Tests
        run: go test -v -vet=asmdecl,assign,atomic,bools,buildtag,cgocall,composites,copylocks,defers,directive,errorsas,framepointer,httpresponse,ifaceassert,loopclosure,lostcancel,nilfunc,shift,sigchanyzer,slog,stdmethods,stringintconv,structtag,testinggoroutine,tests,timeformat,unmarshal,unreachable,unsafeptr,unusedresult $(go list ./...) -tags skipCi

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    needs: [ go-tests ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: ./web/yarn.lock
      - run: yarn install
        working-directory: ./web
      - run: yarn typecheck && yarn lint
        working-directory: ./web
      - name: Prepare embedded web static assets
        if: github.repository == 'the-open-agent/openagent' && github.event_name == 'push'
        run: ./scripts/prepare-embedded-web-assets.sh
      - name: Build embedded frontend
        if: github.repository == 'the-open-agent/openagent' && github.event_name == 'push'
        run: VITE_EMBED_STATIC_ASSETS=true yarn run build
        working-directory: ./web
      - name: Build frontend
        if: github.repository != 'the-open-agent/openagent' || github.event_name != 'push'
        run: yarn run build
        working-directory: ./web
      - name: Upload build artifacts
        if: github.repository == 'the-open-agent/openagent' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./web/build

  backend:
    name: Back-end
    runs-on: ubuntu-latest
    needs: [ go-tests ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.mod
      - run: go version
      - name: Build
        run: |
          go build -race -ldflags "-extldflags '-static'"
        working-directory: ./

  linter:
    name: Go-Linter
    runs-on: ubuntu-latest
    needs: [ go-tests ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Sync vendor tree
        run: go mod vendor

      # CI uses the repo's gofumpt-only golangci-lint config (v2.x is built with Go >= 1.25, matching toolchain).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4
          args: --config .golangci.yml --max-same-issues=0 --timeout 5m ./...


  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Releases are cut by hand: push a `vX.Y.Z` tag and this job publishes it.
    if: github.repository == 'the-open-agent/openagent' && startsWith(github.ref, 'refs/tags/v')
    needs: [ frontend, backend, linter ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./web/build

      - name: Install UPX
        run: sudo apt-get install -y upx-ucl

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./tool/pptx-worker/package-lock.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: |
          TAG="${{ github.ref_name }}"
          # A draft release isn't attached to its tag yet, so "gh release edit <tag>"
          # (which resolves by tag) can't find it. List releases instead — that
          # endpoint includes drafts — and match by tag_name to get the real id.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not find a release for tag $TAG"
            exit 1
          fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -f draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository == 'the-open-agent/openagent' && startsWith(github.ref, 'refs/tags/v')
    needs: [ frontend, backend, linter ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Registry versions keep the historical, un-prefixed form: tag `v1.2.3`
      # publishes `1.2.3`. `latest` is skipped for pre-release tags such as
      # `v1.2.3-beta.1`.
      - name: Resolve the released version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> $GITHUB_OUTPUT
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v3
        with:
          context: .
          target: standard
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            casbin/openagent:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && 'casbin/openagent:latest' || '' }}

      - name: Push All In One Version to Docker Hub
        uses: docker/build-push-action@v3
        with:
          context: .
          target: allinone
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            casbin/openagent-all-in-one:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && 'casbin/openagent-all-in-one:latest' || '' }}

      - uses: actions/checkout@v3
        with:
          repository: the-open-agent/openagent-helm
          ref: 'master'
          token: ${{ secrets.GH_BOT_TOKEN }}

      - name: Update Helm Chart
        run: |
          # Set the appVersion and version of the chart to the current tag
          sed -i "s/appVersion: .*/appVersion: ${{ steps.version.outputs.version }}/g" ./openagent-helm-chart/Chart.yaml
          sed -i "s/version: .*/version: ${{ steps.version.outputs.version }}/g" ./openagent-helm-chart/Chart.yaml

          REGISTRY=oci://registry-1.docker.io/casbin
          cd openagent-helm-chart
          helm package .
          PKG_NAME=$(ls *.tgz)
          helm repo index . --url $REGISTRY --merge index.yaml
          helm push $PKG_NAME $REGISTRY
          rm $PKG_NAME

          # Commit and push the changes back to the repository
          git config --global user.name "casbin-bot"
          git config --global user.email "bot@casbin.org"
          git add Chart.yaml index.yaml
          git commit -m "chore(helm): bump helm charts appVersion to ${{ steps.version.outputs.version }}"
          git tag ${{ steps.version.outputs.version }}
          git push origin HEAD:master --follow-tags
